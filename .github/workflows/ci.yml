name: Build, test, benchmark and publish documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} verification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Install macOS documentation tools
        if: runner.os == 'macOS'
        run: brew install doxygen
      - name: Install Windows documentation tools
        if: runner.os == 'Windows'
        run: choco install doxygen.install --no-progress -y
      - name: Add Windows Doxygen to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\doxygen\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Verify Linux and macOS
        if: runner.os != 'Windows'
        run: bash scripts/verify.sh
      - name: Verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Preserve benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: build/benchmark.json
          if-no-files-found: error
      - name: Preserve HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-${{ runner.os }}
          path: build/docs/html
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: runner.os == 'Linux' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  publish:
    name: Publish Doxygen to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: historical-risk-documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
